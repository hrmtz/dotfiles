# ─── Prefix ─────────────────────────────────────────
# C-b: tmux デフォルト
# Karabiner で terminal apps は C-b リマップ除外済み
set -g prefix C-b
bind C-b send-prefix

# ─── 基本 ───────────────────────────────────────────
set -g escape-time 0            # CapsLock→Escape 遅延排除
set -g history-limit 50000
set -g display-time 2000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g mouse on

# ─── Emacs キーバインド ──────────────────────────────
setw -g mode-keys emacs
set -g status-keys emacs

# ─── 色・表示 ────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"

# ─── ペイン分割（カレントパス引き継ぎ）────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ─── ペインリサイズ ──────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── ウィンドウ ──────────────────────────────────────
bind c new-window -c "#{pane_current_path}"

# ─── ステータスバー（ミニマル）────────────────────────
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=cyan]#S "
set -g status-right ""
set -g status-left-length 20
setw -g window-status-format "#[fg=colour244] #I:#W"
setw -g window-status-current-format "#[fg=cyan,bold] #I:#W"

# ─── ペイン上部タイトル ───────────────────────────────
# Formation window は固定identity + 現在task/status、通常 window は window name を自動表示。
# @formation_* は worker 起動直後に設定されるため、後から値が入っても即時反映される。
setw -g pane-border-status top
setw -g pane-border-format "#{?#{||:#{@formation_identity_locked},#{@formation_id}},#{?#{==:#{@formation_cli},codex},#[fg=colour208],#{?#{==:#{@formation_cli},kimi},#[fg=colour135],#[fg=colour39]}}#[bold] #{?#{@formation_identity_locked},#{@formation_identity_locked},#{@formation_id}} #[nobold]#[fg=colour245]· #{@formation_task}#{?#{@formation_status}, — #{@formation_status},} #[default],#[fg=colour244,bold] #{window_name} #[default]}"

# ─── コピーモード（macOS クリップボード連携）──────────
bind -T copy-mode M-w send -X copy-pipe-and-cancel "pbcopy"
bind ] run "pbpaste | tmux load-buffer - && tmux paste-buffer"

# ─── 設定リロード ────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
