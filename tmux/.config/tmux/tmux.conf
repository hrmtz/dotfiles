# ─── Prefix ─────────────────────────────────────────
# C-t: Emacs の C-a(行頭)/C-b(後退) と衝突しない
# C-t は Emacs の transpose-chars だが使用頻度は低い
unbind C-b
set -g prefix C-t
bind C-t send-prefix

# ─── 基本 ───────────────────────────────────────────
set -g escape-time 0            # CapsLock→Escape 遅延排除
set -g history-limit 50000
set -g display-time 2000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g mouse on

# ─── Emacs キーバインド ──────────────────────────────
setw -g mode-keys emacs
set -g status-keys emacs

# ─── 色・表示 ────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"

# ─── ペイン分割（カレントパス引き継ぎ）────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ─── ペインリサイズ ──────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── ウィンドウ ──────────────────────────────────────
bind c new-window -c "#{pane_current_path}"

# ─── ステータスバー（ミニマル）────────────────────────
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=cyan]#S "
set -g status-right ""
set -g status-left-length 20
setw -g window-status-format "#[fg=colour244] #I:#W"
setw -g window-status-current-format "#[fg=cyan,bold] #I:#W"

# ─── コピーモード（macOS クリップボード連携）──────────
bind -T copy-mode M-w send -X copy-pipe-and-cancel "pbcopy"
bind ] run "pbpaste | tmux load-buffer - && tmux paste-buffer"

# ─── 設定リロード ────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
